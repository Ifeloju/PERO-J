name: WASM Build Verification

on:
  push:
    branches: [main]
  pull_request:

# Maximum optimised WASM size before CI fails (bytes).
# Soroban's protocol limit is 64 KB; we enforce a conservative 60 KB ceiling
# to leave headroom for future growth.
env:
  WASM_SIZE_LIMIT_BYTES: 61440   # 60 KB

jobs:
  wasm-build:
    name: Build & size-check Soroban WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build contract in release mode
        working-directory: contracts/explorer
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --release

      - name: Install Stellar CLI (for wasm optimize)
        run: cargo install --locked stellar-cli --features opt

      - name: Optimise WASM with stellar contract optimize
        working-directory: contracts/explorer
        run: |
          WASM_PATH=$(find ../../target/wasm32-unknown-unknown/release \
            -maxdepth 1 -name '*.wasm' ! -name '*-opt.wasm' | head -n 1)
          echo "Raw WASM: $WASM_PATH"
          stellar contract optimize --wasm "$WASM_PATH"
          OPT_PATH="${WASM_PATH%.wasm}.optimized.wasm"
          echo "OPT_WASM=$OPT_PATH" >> "$GITHUB_ENV"

      - name: Assert WASM byte-size is within the configured limit
        run: |
          SIZE=$(wc -c < "$OPT_WASM")
          LIMIT=${{ env.WASM_SIZE_LIMIT_BYTES }}
          echo "Optimised WASM size: ${SIZE} bytes (limit: ${LIMIT} bytes)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::WASM binary (${SIZE} B) exceeds the ${LIMIT} B limit."
            echo "::error::Reduce dependencies or strip unused code before merging."
            exit 1
          fi
          echo "✅ WASM size OK: ${SIZE} / ${LIMIT} bytes"

      - name: Upload optimised WASM as build artefact
        uses: actions/upload-artifact@v4
        with:
          name: soroban-explorer-optimized-wasm
          path: ${{ env.OPT_WASM }}
          retention-days: 30
